#!/usr/bin/env bash
# backup.conf — Configuration for backup.sh
# Sourced (not executed) by the backup script.

# ── Paths ──────────────────────────────────────────────────────────────
DUCKDB_HOST_PATH="/root/BlueHorseshoe/data/ohlcv.duckdb"
MODELS_HOST_PATH="/root/BlueHorseshoe/src/models"
PIPELINE_STATUS="/root/BlueHorseshoe/src/logs/pipeline_status.json"
STAGING_DIR="/tmp/bh_backup_$$"

# ── Docker ─────────────────────────────────────────────────────────────
DOCKER_CONTAINER="bluehorseshoe"
DUCKDB_CONTAINER_PATH="/workspaces/BlueHorseshoe/data/ohlcv.duckdb"

# ── MongoDB collections to dump (skip dead historical_prices*) ─────────
MONGO_COLLECTIONS=(
    trade_scores
    journal_batches
    journal_signals
    symbols
    symbol_overviews
    symbol_news
    symbol_news_tiingo
    symbol_news_stocktwits
    sentiment_snapshots
    loader_checkpoints
)

# ── rclone / Google Drive ──────────────────────────────────────────────
RCLONE_REMOTE="gdrive"
GDRIVE_BASE="BlueHorseshoe/backups"
DAILY_RETENTION_COUNT=7
WEEKLY_RETENTION_COUNT=4

# ── Source docker/.env for SMTP creds and MONGO_BIND_IP ────────────────
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
if [[ -f "$SCRIPT_DIR/docker/.env" ]]; then
    # Export only the variables we need, ignoring comments and blanks
    while IFS='=' read -r key value; do
        case "$key" in
            SMTP_SERVER|SMTP_PORT|SMTP_USER|SMTP_PASSWORD|\
            EMAIL_SENDER|EMAIL_RECIPIENT|MONGO_BIND_IP)
                export "$key=$value"
                ;;
        esac
    done < <(grep -v '^\s*#' "$SCRIPT_DIR/docker/.env" | grep -v '^\s*$')
fi

# ── Defaults ───────────────────────────────────────────────────────────
MONGO_BIND_IP="${MONGO_BIND_IP:-127.0.0.1}"
