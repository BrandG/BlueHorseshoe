#!/usr/bin/env bash
# backup.conf — Configuration for backup.sh
# Sourced (not executed) by the backup script.

# ── Paths ──────────────────────────────────────────────────────────────
DUCKDB_HOST_PATH="/root/BlueHorseshoe/data/ohlcv.duckdb"
FX_DUCKDB_HOST_PATH="/root/BlueHorseshoe/data/fx_4h.duckdb"
MODELS_HOST_PATH="/root/BlueHorseshoe/src/models"
PIPELINE_STATUS="/root/BlueHorseshoe/src/logs/pipeline_status.json"
STAGING_DIR="/tmp/bh_backup_$$"

# ── Python (host venv) ────────────────────────────────────────────────
PYTHON="/root/BlueHorseshoe/.venv/bin/python"

# ── MongoDB collections to dump (skip dead historical_prices*) ─────────
MONGO_COLLECTIONS=(
    trade_scores
    journal_batches
    journal_signals
    symbols
    symbol_overviews
    symbol_news
    symbol_news_tiingo
    symbol_news_stocktwits
    symbol_news_finviz
    sentiment_snapshots
    loader_checkpoints
)

# ── rclone / Google Drive ──────────────────────────────────────────────
RCLONE_REMOTE="gdrive"
GDRIVE_BASE="BlueHorseshoe/backups"
DAILY_RETENTION_COUNT=7
WEEKLY_RETENTION_COUNT=4

# ── Source environment variables ───────────────────────────────────────
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

# Root .env has host-accessible MONGO_URI (127.0.0.1), SMTP creds, etc.
if [[ -f "$SCRIPT_DIR/.env" ]]; then
    while IFS='=' read -r key value; do
        case "$key" in
            SMTP_SERVER|SMTP_PORT|SMTP_USER|SMTP_PASSWORD|\
            EMAIL_SENDER|EMAIL_RECIPIENT|MONGO_BIND_IP|MONGO_URI)
                export "$key=$value"
                ;;
        esac
    done < <(grep -v '^\s*#' "$SCRIPT_DIR/.env" | grep -v '^\s*$')
fi

# ── Defaults ───────────────────────────────────────────────────────────
MONGO_BIND_IP="${MONGO_BIND_IP:-127.0.0.1}"
