services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    ports:
      - "${MONGO_BIND_IP:-127.0.0.1}:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_net

  bluehorseshoe:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bluehorseshoe
    container_name: bluehorseshoe
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      ALPHAVANTAGE_KEY: ${ALPHAVANTAGE_KEY}
      ALPHAVANTAGE_CPS: 1
      TIINGO_API_KEY: ${TIINGO_API_KEY}
      TIINGO_CPS: ${TIINGO_CPS:-5}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_RECIPIENT: ${EMAIL_RECIPIENT}
      EMAIL_SENDER: ${EMAIL_SENDER}
      IBKR_HOST: ${IBKR_HOST:-ib-gateway}
      IBKR_PORT: ${IBKR_PORT:-4004}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-1}
      PAPER_TRADING_ENABLED: ${PAPER_TRADING_ENABLED:-false}
      PAPER_TOTAL_INVESTMENT: ${PAPER_TOTAL_INVESTMENT:-10000}
      PAPER_MAX_POSITIONS: ${PAPER_MAX_POSITIONS:-10}
    depends_on:
      - mongo
    networks:
      - app_net
    cpus: 1.5
    mem_limit: 4g
    volumes:
      # Mount the src folder from host into the container
      - ..:/workspaces/BlueHorseshoe

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: ib-gateway
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: ${IBKR_READ_ONLY:-yes}
      TWOFA_TIMEOUT_ACTION: restart
      AUTO_RESTART_TIME: ""
      ACCEPT_INCOMING_CONNECTION: accept
    ports:
      - "4001:4001"
      - "4002:4002"
      - "4004:4004"
      - "5900:5900"
    networks:
      - app_net
    mem_limit: 512m

networks:
  app_net:

volumes:
  mongo_data:
