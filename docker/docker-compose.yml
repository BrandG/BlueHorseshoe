services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    command: ["mongod", "--wiredTigerCacheSizeGB", "1", "--auth"]
    ports:
      - "${MONGO_BIND_IP:-127.0.0.1}:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_net

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: ib-gateway
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: ${IBKR_READ_ONLY:-yes}
      TWOFA_TIMEOUT_ACTION: restart
      # IBC restarts the Java process daily at this UTC time. Set to 08:00
      # (= 4am ET) — past IBKR's nightly server-maintenance disconnect
      # (~01:40 UTC) and well before US market open (13:30 UTC). Without
      # this, the Java process tries to auto-reconnect after the daily
      # disconnect and often wedges silently (container stays up but the
      # API listener inside is dead). Watchdog cron is the backstop for
      # any failure mode IBC's daily restart misses.
      AUTO_RESTART_TIME: "08:00"
      ACCEPT_INCOMING_CONNECTION: accept
      # Always claim the IBKR session on startup. Required for unattended
      # operation — if a human is logged into the portal, the gateway will
      # take over rather than wait on a manual-resolution dialog.
      EXISTING_SESSION_DETECTED_ACTION: primary
      # Enable VNC for debugging the gateway UI on port 5900. Strip this
      # back out once unattended operation is verified.
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-vncdebug}
    ports:
      - "4001:4001"
      - "4002:4002"
      - "4004:4004"
      - "5900:5900"
    networks:
      - app_net
    mem_limit: 512m

networks:
  app_net:

volumes:
  mongo_data:
